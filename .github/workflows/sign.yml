name: Sign binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sign:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installers from latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $tag = gh release list -R ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName'
          gh release download $tag -R ${{ github.repository }} -p "*.exe" -D dist
          Get-ChildItem dist

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign files
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: https://eus.codesigning.azure.net
          signing-account-name: jamesdancersigning
          certificate-profile-name: SwoopyScript
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe,dll,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
